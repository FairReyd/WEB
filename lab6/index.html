<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зміна кольору фону</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100">

    <h1 class="mb-3">Зміна кольору фону сторінки</h1>

    <!-- Поле введення кольору -->
    <input type="text" id="colorInput" class="form-control w-50 mb-3" placeholder="Введіть назву або HEX-код кольору (наприклад, red або #ff0000)">

    <!-- Кнопка для зміни кольору заголовка -->
    <button id="changeColor" class="btn btn-primary">Змінити фон</button>

    <script src="script.js"></script>
</body>
</html>
