<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="nav-menu">
        <a href="#">Головна</a>
        <a href="#">Про нас</a>
        <a href="#">Послуги</a>
        <a href="#">Контакти</a>
        <a href="#">Блог</a>
    </nav>

    <section class="cards-section">
        <div class="card">
            <img src="laptop.jpg" alt="Сучасний ноутбук">
            <h3>Сучасний ноутбук</h3>
            <p>Ноутбук із потужним процесором та великим екраном для навчання</p>
            <button class="card-btn">Купити</button>
        </div>

        <div class="card">
            <img src="webinar.png" alt="Вебінар">
            <h3>Вебінар</h3>
            <p>Дізнайся всі секрети веб-розробки та побудови сайтів на нашому вебінарі</p>
            <button class="card-btn">Записатися</button>
        </div>

        <div class="card">
            <img src="tshirt.png" alt="Крута футболка">
            <h3>Крута футболка</h3>
            <p>100% бавовна, доступні різні кольори та розміри для кожного, тигр VS вовк</p>
            <button class="card-btn">Детальніше</button>
        </div>
    </section>

    <div class="buttons-block">
        <button class="action-btn">Кнопка 1</button>
        <button class="action-btn">Кнопка 2</button>
        <button class="action-btn">Кнопка 3</button>
    </div>

</body>
</html>
